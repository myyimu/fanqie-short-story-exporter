plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.myyimu.fanqiestory'
    compileSdk 35

    defaultConfig {
        applicationId 'com.myyimu.fanqiestory'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.4.0'
    }

    flavorDimensions 'abi'
    productFlavors {
        phone {
            dimension 'abi'
            ndk { abiFilters 'arm64-v8a' }
        }
        emulator {
            dimension 'abi'
            ndk { abiFilters 'x86_64' }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDir('../../src/fanqie_short_story/web')
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
}

chaquopy {
    defaultConfig {
        version = '3.13'
        buildPython('python3.13')
    }
    sourceSets {
        getByName('main') {
            srcDir('../../src')
        }
    }
}
