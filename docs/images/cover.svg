      <stop offset="1" stop-color="#f0d3bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c84e38"/>
      <stop offset="1" stop-color="#ad3c2c"/>
    </linearGradient>
    <filter id="bookShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="15" dy="24" stdDeviation="19" flood-color="#684736" flood-opacity=".28"/>
    </filter>
  </defs>

