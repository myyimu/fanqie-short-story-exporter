<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Fanqie Short Story Exporter</title>
  <desc id="desc">A warm cream project cover with editorial type and a red storybook.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f2e9"/>
      <stop offset="1" stop-color="#eee3d4"/>
    </linearGradient>
    <radialGradient id="blush">
