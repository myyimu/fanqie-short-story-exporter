[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fanqie-short-story-exporter"
version = "0.4.4"
description = "Export the content returned by Fanqie short-story share links to TXT, Markdown or EPUB"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "myyimu"}]
keywords = ["fanqie", "short-story", "txt", "markdown", "epub"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
fanqie-short-story = "fanqie_short_story.cli:main"
fanqie-short-story-ui = "fanqie_short_story.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fanqie_short_story = ["web/*.html", "web/*.css", "web/*.js"]
