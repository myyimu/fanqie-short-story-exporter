name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run shared exporter tests
        run: python -m unittest discover -s tests -v

      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build installable APK
        run: gradle --project-dir android :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fanqie-short-story-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
