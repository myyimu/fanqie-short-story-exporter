name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run shared exporter tests
        run: python -m unittest discover -s tests -v

      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build installable APK
        run: gradle --project-dir android :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fanqie-short-story-android-phone-debug
          path: android/app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: fanqie-short-story-android-emulator-debug
          path: android/app/build/outputs/apk/emulator/debug/app-emulator-debug.apk
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: fanqie-short-story-android-emulator-debug
          path: android-apk

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch APK in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install android-apk/app-emulator-debug.apk
            adb logcat -c
            adb shell am start -W -n com.myyimu.fanqiestory/.MainActivity
            sleep 8
            adb shell pidof com.myyimu.fanqiestory
            FANQIE_SCREENSHOT_DIR="$RUNNER_TEMP/fanqie-screenshots" python3 android/smoke.py
            adb shell pidof com.myyimu.fanqiestory
            adb logcat -d -s AndroidRuntime:E > "$RUNNER_TEMP/android-runtime.log"
            if grep -Fq 'FATAL EXCEPTION' "$RUNNER_TEMP/android-runtime.log"; then cat "$RUNNER_TEMP/android-runtime.log"; fi
            if grep -Fq 'Process: com.myyimu.fanqiestory,' "$RUNNER_TEMP/android-runtime.log"; then exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fanqie-android-screenshots
          path: ${{ runner.temp }}/fanqie-screenshots/*.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fanqie-android-runtime-log
          path: ${{ runner.temp }}/android-runtime.log
          if-no-files-found: warn
