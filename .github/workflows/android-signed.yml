name: Build signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run shared exporter tests
        run: python -m unittest discover -s tests -q

      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$SIGNING_PASSWORD" ]]; then
            echo 'Release signing secrets are missing' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fanqie-release.jks"
          chmod 600 "$RUNNER_TEMP/fanqie-release.jks"

      - name: Verify signing certificate identity
        env:
          FANQIE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          expected="$(cat android/release-cert.sha256)"
          actual="$(keytool -exportcert -keystore "$RUNNER_TEMP/fanqie-release.jks" -storepass:env FANQIE_RELEASE_PASSWORD -alias fanqie-release 2>/dev/null | sha256sum | cut -d ' ' -f 1)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Release certificate differs from the pinned fingerprint' >&2
            exit 1
          fi

      - name: Build signed phone APK
        env:
          FANQIE_RELEASE_KEYSTORE: ${{ runner.temp }}/fanqie-release.jks
          FANQIE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: gradle --project-dir android :app:assemblePhoneRelease --no-daemon

      - name: Verify APK signature
        run: |
          apk='android/app/build/outputs/apk/phone/release/app-phone-release.apk'
          expected="$(cat android/release-cert.sha256)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          if ! grep -Fqi "Signer #1 certificate SHA-256 digest: $expected" "$RUNNER_TEMP/apk-signature.txt"; then
            echo 'APK certificate differs from the pinned fingerprint' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fanqie-short-story-android-phone-signed
          path: android/app/build/outputs/apk/phone/release/app-phone-release.apk
          if-no-files-found: error
