name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows package
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $zip = Get-ChildItem -LiteralPath dist -Filter 'FanqieShortStoryExporter-*-Windows.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Windows ZIP not found' }
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" "$($zip.FullName)" --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$env:RELEASE_TAG" "$($zip.FullName)" --title "$env:RELEASE_TAG" --notes '新增 EPUB 导出和手动多链接批量下载。' --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release failed' }
